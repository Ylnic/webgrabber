<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGrabber</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #18212f;
        --muted: #5d6b7d;
        --accent: #1e6fe8;
        --accent-dark: #164bb8;
        --border: #dfe7f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 820px;
        margin: 48px auto;
        padding: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 38px rgba(17, 24, 39, 0.08);
        padding: 28px;
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      input, select, button {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
      }
      button {
        margin-top: 20px;
        background: var(--accent);
        color: white;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-dark);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .meta {
        color: var(--muted);
        margin-bottom: 22px;
      }
      #result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 10px;
        background: #f7f9fc;
        border: 1px solid var(--border);
        white-space: pre-wrap;
      }
      #download-controls {
        display: none;
        margin-top: 20px;
        border-top: 1px solid var(--border);
        padding-top: 16px;
      }
      #download-controls > label {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      #download-controls input[type="radio"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      #download-controls .row input {
        width: 100%;
        height: auto;
      }
      @media (max-width: 700px) {
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>WebGrabber</h1>
        <div class="meta">Webbplatsanalys och hämtning</div>

        <form id="crawl-form">
          <label for="start_url">Webbplats eller domän</label>
          <input id="start_url" type="text" value="https://example.com" required>
          <p>Webbplatsen analyseras först, upp till 200 sidor och djup 5. Därefter väljer du hämtningsomfattning.</p>
          <button type="submit">Analysera webbplats</button>
        </form>

        <div id="result" aria-live="polite">Redo för att analysera en webbplats.</div>
        <form id="download-controls">
          <div class="row">
            <div>
              <label for="max_pages">Hämta högst antal sidor</label>
              <input id="max_pages" type="number" value="200" min="1" max="200" required>
            </div>
            <div>
              <label for="max_depth">Maxdjup</label>
              <input id="max_depth" type="number" value="5" min="0" max="5" required>
            </div>
          </div>
          <strong>Vad vill du hämta?</strong>
          <label><input type="radio" name="mode" value="text" checked>Hämta enbart text</label>
          <label><input type="radio" name="mode" value="all">Hämta allt innehåll</label>
          <button type="submit">Hämta som ZIP</button>
        </form>
      </div>
    </div>

    <script>
      const form = document.getElementById('crawl-form');
      const downloadForm = document.getElementById('download-controls');
      const result = document.getElementById('result');
      let currentJobId = null;

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          start_url: document.getElementById('start_url').value.trim(),
          max_pages: 200,
          max_depth: 5
        };

        downloadForm.style.display = 'none';
        currentJobId = null;
        result.textContent = 'Analyserar sidor och länkar...';

        const response = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          result.textContent = data.error || 'Kunde inte starta crawl.';
          return;
        }

        const poll = async () => {
          const statusResponse = await fetch(`/api/jobs/${data.job_id}`);
          const statusData = await statusResponse.json();
          if (statusData.status === 'failed' || statusData.status === 'cancelled') {
            result.textContent = statusData.error || 'Analysen misslyckades.';
            return;
          }
          if (['complete', 'time_limit', 'limit_reached'].includes(statusData.status)) {
            currentJobId = statusData.job_id;
            const domains = statusData.external_domains.length
              ? statusData.external_domains.join(', ')
              : 'Inga externa domäner eller subdomäner hittades';
            const types = Object.entries(statusData.file_types)
              .map(([type, count]) => `${type}: ${count}`).join(', ') || 'Inga filer hittades';
            document.getElementById('max_pages').value = Math.max(1, statusData.pages.length);
            document.getElementById('max_depth').value = statusData.max_depth_reached;
            result.textContent = [
              `Webbsidor hittade: ${statusData.pages.length}`,
              `Djup som analyserats: ${statusData.max_depth_reached}`,
              `Interna sidlänkar: ${statusData.linked_pages.length}`,
              `Länkade filer: ${statusData.file_count}`,
              `Filtyper: ${types}`,
              `Analyserad datamängd: ${(statusData.estimated_bytes / (1024 * 1024)).toFixed(2)} MB`,
              `Domäner/subdomäner (${statusData.external_domains.length}): ${domains}`,
              `Analysstatus: ${statusData.status}${statusData.limit_reason ? ` (${statusData.limit_reason})` : ''}`
            ].join('\\n');
            downloadForm.style.display = 'block';
            return;
          }
          setTimeout(poll, 1500);
        };

        poll();
      });

      downloadForm.addEventListener('submit', async (event) => {
        event.preventDefault();
        if (!currentJobId) return;
        result.textContent = 'Förbereder ZIP...';
        const mode = new FormData(downloadForm).get('mode');
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            job_id: currentJobId,
            mode,
            max_pages: Number(document.getElementById('max_pages').value),
            max_depth: Number(document.getElementById('max_depth').value)
          })
        });
        if (!response.ok) {
          const data = await response.json();
          result.textContent = data.error || 'Kunde inte skapa ZIP-filen.';
          return;
        }
        const blob = await response.blob();
        const objectUrl = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = objectUrl;
        link.download = `webgrabber-${currentJobId}.zip`;
        link.click();
        setTimeout(() => URL.revokeObjectURL(objectUrl), 1000);
        result.textContent = 'ZIP-filen har hämtats.';
        downloadForm.style.display = 'none';
      });
    </script>
  </body>
</html>
