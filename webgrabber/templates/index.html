<!doctype html>
<html lang="sv">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>WebGrabber</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --panel: #ffffff;
        --ink: #18212f;
        --muted: #5d6b7d;
        --accent: #1e6fe8;
        --accent-dark: #164bb8;
        --border: #dfe7f2;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      .wrap {
        max-width: 820px;
        margin: 48px auto;
        padding: 24px;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: 0 14px 38px rgba(17, 24, 39, 0.08);
        padding: 28px;
      }
      h1 {
        margin-top: 0;
        font-size: 2rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin: 16px 0 8px;
      }
      input, select, button {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid var(--border);
        font-size: 1rem;
      }
      button {
        margin-top: 20px;
        background: var(--accent);
        color: white;
        border: none;
        font-weight: 700;
        cursor: pointer;
      }
      button:hover {
        background: var(--accent-dark);
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }
      .meta {
        color: var(--muted);
        margin-bottom: 22px;
      }
      #result {
        margin-top: 24px;
        padding: 16px;
        border-radius: 10px;
        background: #f7f9fc;
        border: 1px solid var(--border);
        white-space: pre-wrap;
      }
      @media (max-width: 700px) {
        .row { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <h1>WebGrabber</h1>
        <div class="meta">Hosted on <strong>{{ hostname }}</strong> for web-based crawl jobs.</div>

        <form id="crawl-form">
          <label for="start_url">Webbplats eller domän</label>
          <input id="start_url" type="text" value="https://example.com" required>

          <div class="row">
            <div>
              <label for="max_pages">Max antal sidor</label>
              <input id="max_pages" type="number" value="200" min="1">
            </div>
            <div>
              <label for="max_depth">Crawl-djup</label>
              <input id="max_depth" type="number" value="3" min="0">
            </div>
          </div>

          <div class="row">
            <div>
              <label for="max_file_size_mb">Max filstorlek (MB)</label>
              <input id="max_file_size_mb" type="number" value="50" min="1">
            </div>
            <div>
              <label for="include_files">Hämta filer</label>
              <select id="include_files">
                <option value="true" selected>Ja</option>
                <option value="false">Nej</option>
              </select>
            </div>
          </div>

          <button type="submit">Starta crawl</button>
        </form>

        <div id="result">Redo för att starta crawl.</div>
      </div>
    </div>

    <script>
      const form = document.getElementById('crawl-form');
      const result = document.getElementById('result');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();
        const payload = {
          start_url: document.getElementById('start_url').value.trim(),
          max_pages: Number(document.getElementById('max_pages').value) || null,
          max_depth: Number(document.getElementById('max_depth').value) || 3,
          max_file_size_mb: Number(document.getElementById('max_file_size_mb').value) || null,
          include_files: document.getElementById('include_files').value === 'true'
        };

        result.textContent = 'Startar jobb...';

        const response = await fetch('/api/start', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await response.json();
        if (!response.ok) {
          result.textContent = data.error || 'Kunde inte starta crawl.';
          return;
        }

        const poll = async () => {
          const statusResponse = await fetch(`/api/jobs/${data.job_id}`);
          const statusData = await statusResponse.json();
          result.textContent = JSON.stringify(statusData, null, 2);
          if (statusData.status === 'complete' || statusData.status === 'failed' || statusData.status === 'cancelled') {
            return;
          }
          setTimeout(poll, 1500);
        };

        poll();
      });
    </script>
  </body>
</html>
